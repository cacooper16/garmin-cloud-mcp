name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The npm major releases use (release.yml), so CI catches npm changes first.
      - run: npm i -g npm@11
      - run: npm ci
      # Type-check, unit tests, and the end-to-end test (real Worker in
      # Miniflare, GitHub and Garmin faked). No Cloudflare account needed.
      - run: npm run check
