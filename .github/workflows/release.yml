name: Release

# Runs when a GitHub release is published (tag vX.Y.Z). Publishes to npm and
# the MCP Registry, then attaches the Claude Desktop extension to the release.
# Each step stops the job on failure, so nothing later runs after a failure.
on:
  release:
    types: [published]

permissions:
  contents: write # gh release upload
  id-token: write # npm trusted publishing, MCP Registry login and build attestation (OIDC)
  attestations: write # build provenance for garmin-mcp.mcpb

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      # Pinned on purpose (the registry docs advise against releases/latest).
      # Bump it deliberately; the download's signature is checked below.
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore a cache into a release build.
          package-manager-cache: false

      # npm trusted publishing needs npm 11.5.1 or newer. Pinned to a major (not
      # latest) so a new npm major can't change behaviour under a release; CI uses
      # the same one.
      - run: npm i -g npm@11

      - name: Check the tag matches every version
        run: |
          set -euo pipefail
          want="${TAG#v}"
          fail=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error::$1 is $2, but the release tag is $TAG"
              fail=1
            fi
          }
          check package.json "$(jq -r .version package.json)"
          check "server.json version" "$(jq -r .version server.json)"
          check "server.json packages[0].version" "$(jq -r '.packages[0].version' server.json)"
          check mcpb/manifest.json "$(jq -r .version mcpb/manifest.json)"
          check src/server.ts "$(sed -n 's/^export const SERVER_VERSION = "\(.*\)";$/\1/p' src/server.ts)"
          exit $fail

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # No NPM_TOKEN: npm trusted publishing authenticates with the OIDC token.
      # Skipped if this version is already on npm, so a re-run can finish the
      # later steps.
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ "$(npm view "garmin-mcp@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "garmin-mcp@$version is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      # Before the registry step, so a registry hiccup can't stop the Claude
      # Desktop download from being attached to the release.
      - name: Build the Claude Desktop extension
        run: npm run build:mcpb

      # Signed provenance tying garmin-mcp.mcpb to this repo, workflow and
      # commit. Anyone can check a download with:
      #   gh attestation verify garmin-mcp.mcpb --repo colincooperio/garmin-mcp
      - name: Attest the Claude Desktop extension
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: garmin-mcp.mcpb

      # The update check downloads one of these once a day (latest-mcpb.json
      # from the Desktop extension, latest-npx.json from npx and npm installs,
      # latest-cloud.json from the Worker); GitHub's per-asset download
      # counts are the rough install numbers. See src/update.ts.
      - name: Write the update-check version files
        env:
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          for type in mcpb npx cloud; do
            jq -n --arg latest "${TAG#v}" --arg url "$RELEASE_URL" '{latest: $latest, url: $url}' > "latest-$type.json"
            cat "latest-$type.json"
          done

      - name: Attach the Claude Desktop extension and version files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" garmin-mcp.mcpb latest-mcpb.json latest-npx.json latest-cloud.json --clobber

      # The registry checks the version exists on npm, and a just-published
      # version can take a minute or two to appear there.
      - name: Wait for npm to show the new version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "garmin-mcp@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "garmin-mcp@$version is visible on npm."
              exit 0
            fi
            echo "Waiting for garmin-mcp@$version to appear on npm ($i/30)..."
            sleep 10
          done
          echo "::error::garmin-mcp@$version still isn't visible on npm after 5 minutes. Re-run the workflow once it is: npm publish and the .mcpb upload are skipped or repeated safely."
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

